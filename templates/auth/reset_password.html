<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script>(function(){var t=localStorage.getItem('arps-theme')||'light';document.documentElement.setAttribute('data-theme',t)})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | ARPTGS — IBB University</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/arps.css') }}" rel="stylesheet">
</head>
<body>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div id="flash-container">
    {% for cat, msg in messages %}
    <div class="flash-toast toast-{{ cat }}">
      <i class="bi bi-check-circle-fill toast-icon"></i>
      <span>{{ msg }}</span>
      <button class="toast-close"><i class="bi bi-x"></i></button>
    </div>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:1.5rem;">
  <div style="width:100%;max-width:420px;">

    <div style="background:#fff;border-radius:var(--r-xl);padding:2.25rem;box-shadow:var(--sh-xl);border:1px solid var(--border);">

      <!-- Icon -->
      <div style="width:56px;height:56px;background:var(--g100);border:2px solid var(--g200);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;font-size:1.5rem;">
        🔑
      </div>

      <h2 style="font-family:'Playfair Display',serif;font-size:1.45rem;color:var(--g800);text-align:center;margin-bottom:.35rem;">
        Set new password
      </h2>
      <p style="font-size:.8rem;color:var(--n500);text-align:center;margin-bottom:1.75rem;">
        Create a strong password you haven't used before.
      </p>

      <form method="POST" action="{{ url_for('auth.reset_password') }}" novalidate>
        <div class="form-group">
          <label class="form-label">New Password <span class="req">*</span></label>
          <div class="input-group">
            <span class="input-addon"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" id="pw1" class="form-control"
                   placeholder="At least 6 characters" required minlength="6"
                   oninput="checkStrength(this.value)">
            <button type="button" onclick="togglePassword('pw1','eye1')"
                    style="padding:0 .75rem;background:var(--surface-2);border:1.5px solid var(--border-s);border-left:none;border-radius:0 var(--r-sm) var(--r-sm) 0;cursor:pointer;color:var(--n400);">
              <i class="bi bi-eye" id="eye1"></i>
            </button>
          </div>
          <!-- Strength bar -->
          <div style="height:4px;background:var(--n100);border-radius:2px;margin-top:.4rem;overflow:hidden;">
            <div id="strengthBar" style="height:100%;width:0%;border-radius:2px;transition:width .3s,background .3s;"></div>
          </div>
          <div id="strengthLabel" class="form-hint"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm New Password <span class="req">*</span></label>
          <div class="input-group">
            <span class="input-addon"><i class="bi bi-lock-fill"></i></span>
            <input type="password" name="confirm_password" id="pw2" class="form-control"
                   placeholder="Repeat your new password" required>
            <button type="button" onclick="togglePassword('pw2','eye2')"
                    style="padding:0 .75rem;background:var(--surface-2);border:1.5px solid var(--border-s);border-left:none;border-radius:0 var(--r-sm) var(--r-sm) 0;cursor:pointer;color:var(--n400);">
              <i class="bi bi-eye" id="eye2"></i>
            </button>
          </div>
          <div id="matchHint" class="form-hint"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:.25rem;">
          <i class="bi bi-check2-circle"></i> Reset Password
        </button>
      </form>
    </div>

    <p style="text-align:center;font-size:.7rem;color:var(--n400);margin-top:1.25rem;">
      © 2026 Ibrahim Badamasi Babangida University, Lapai
    </p>
  </div>
</div>

<script src="{{ url_for('static', filename='js/arps.js') }}"></script>
<script>
function checkStrength(pw) {
  const bar = document.getElementById('strengthBar');
  const lbl = document.getElementById('strengthLabel');
  let score = 0;
  if (pw.length >= 6) score++;
  if (pw.length >= 10) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  const levels = [
    { pct:'15%', col:'var(--danger)',  txt:'Too short' },
    { pct:'30%', col:'var(--danger)',  txt:'Weak' },
    { pct:'55%', col:'var(--warning)', txt:'Fair' },
    { pct:'80%', col:'var(--g500)',    txt:'Good' },
    { pct:'100%',col:'var(--success)', txt:'Strong' },
  ];
  const lvl = levels[Math.max(0, score-1)] || levels[0];
  bar.style.width = pw.length ? lvl.pct : '0%';
  bar.style.background = lvl.col;
  lbl.textContent = pw.length ? lvl.txt : '';
  lbl.style.color = lvl.col;
}

document.getElementById('pw2')?.addEventListener('input', function() {
  const pw1 = document.getElementById('pw1').value;
  const hint = document.getElementById('matchHint');
  if (!this.value) { hint.textContent=''; return; }
  if (this.value === pw1) {
    hint.textContent = '✓ Passwords match';
    hint.style.color = 'var(--success)';
  } else {
    hint.textContent = '✗ Passwords do not match';
    hint.style.color = 'var(--danger)';
  }
});
</script>
</body>
</html>
